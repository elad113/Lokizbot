name: Build LokiBot APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build standalone frontend
        working-directory: web
        env:
          VITE_API_BASE_URL: https://lokibot-api.onrender.com
          VITE_LOKIZON_AI_API_KEY: ${{ secrets.LOKIZON_AI_API_KEY }}
        run: |
          npm install
          npm run build
      - name: Bundle frontend into Android app
        run: |
          mkdir -p app/src/main/assets/site
          cp -R web/dist/. app/src/main/assets/site/
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lokibot-independent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
